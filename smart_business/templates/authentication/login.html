<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            font-family: Arial;
            background: #3498db;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>

    {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>
    <p style="text-align:center; margin-top:15px;">
        <a href="{% url 'register' %}" 
        style="display:inline-block; padding:10px 15px; background:#2ecc71; color:white; text-decoration:none; border-radius:5px;">
            Create New Account
        </a>
    </p>
</div>

</body>
</html>
