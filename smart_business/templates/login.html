<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    display:flex; justify-content:center; align-items:center;
    height:100vh; margin:0;
}
.container {
    background:#fff; padding:30px; border-radius:10px;
    width:300px; box-shadow:0 8px 20px rgba(0,0,0,0.2);
}
h2 { text-align:center; }
input {
    width:100%; padding:10px; margin:10px 0;
    border-radius:5px; border:1px solid #ccc;
}
button {
    width:100%; padding:10px;
    background:#4facfe; color:#fff; border:none;
    border-radius:5px; cursor:pointer;
}
button:hover { background:#00c6ff; }
a { text-decoration:none; color:#4facfe; }
</style>
</head>
<body>

<div class="container">
<h2>Login</h2>

<form method="POST">
{% csrf_token %}
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<p style="text-align:center;">No account? <a href="{% url 'register' %}">Register</a></p>
</div>

</body>
</html>
