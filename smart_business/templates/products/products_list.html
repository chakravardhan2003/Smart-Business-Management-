{% extends "base.html" %}

{% block content %}

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;">📦 Products</h2>

    <a href="/products/add/">
        <button style="background:#2ecc71;">+ Add Product</button>
    </a>
</div>

<!-- SEARCH BAR -->
<form method="GET" style="margin-bottom:20px; display:flex; gap:10px;">
    <input type="text" name="search" placeholder="Search product..."
           style="padding:10px; width:250px; border-radius:6px; border:1px solid #ccc;">
    <button type="submit">Search</button>
</form>

<form method="GET">
    <select name="category">
        <option value="">All Categories</option>
        {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
        {% endfor %}
    </select>

    <button type="submit">Filter</button>
</form>

<!-- PRODUCTS TABLE -->
<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Price</th>
    <th>Quantity</th>
    <th>Actions</th>
    <th>Category</th>
</tr>

{% for product in products %}

<tr>
    <td>{{ product.id }}</td>
    <td>{{ product.name }}</td>
    <td>₹ {{ product.price }}</td>
    <td>{{ product.quantity }}</td>
    <td>{{ product.category.name }}</td>

    <td>
        <a href="{% url 'edit_product' product.id %}">
            <button style="background:#3498db;">Edit</button>
        </a>

        <a href="{% url 'delete_product' product.id %}">
            <button style="background:#e74c3c;">Delete</button>
        </a>
    </td>
</tr>

{% empty %}

<tr>
    <td colspan="5" style="text-align:center; padding:20px; color:gray;">
        No products found
    </td>
</tr>

{% endfor %}

</table>

{% endblock %}
