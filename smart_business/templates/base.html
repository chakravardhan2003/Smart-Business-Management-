<!DOCTYPE html>
<html>
<head>

<title>Smart Business Management</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

.sidebar{
width:220px;
height:100vh;
background:linear-gradient(to bottom,red,pink);
position:fixed;
color:white;
}

.sidebar h2{
text-align:center;
padding:20px;
border-bottom:1px solid #444;
}

.sidebar a{
display:block;
padding:15px;
color:white;
text-decoration:none;
}

.sidebar a:hover{
background:linear-gradient(to right,red,white);
}

.main{
margin-left:220px;
padding:20px;
}

.topbar{
background:white;
padding:15px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.content{
margin-top:20px;
}

.card-container{
display:flex;
gap:20px;
}

.card{
background:white;
padding:30px;
border-radius:10px;
width:200px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
text-align:center;
}

.card h3{
margin:0;
color:#555;
}

.card h1{
margin-top:10px;
color:#3498db;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

table th, table td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:left;
}

button{
background:#3498db;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>Inventra</h2>

<a href="/dashboard/">Dashboard</a>
<a href="/products/">Products</a>
<a href="/customers/">Customers</a>
<a href="/orders/">Orders</a>
<a href="/auth/logout/">Logout</a>

</div>

<div class="main">

<div class="topbar">
<h3>Business Management System</h3>
</div>

<div class="content">

{% block content %}

{% endblock %}

</div>

</div>

</body>
</html>
