{% extends "base.html" %}

{% block content %}

<h2>Customers</h2>

<a href="/customers/add/">
<button>Add Customer</button>
</a>

<br><br>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
</tr>

{% for customer in customers %}

<tr>
<td>{{ customer.id }}</td>
<td>{{ customer.name }}</td>
<td>{{ customer.phone }}</td>
<td>{{ customer.email }}</td>
</tr>

{% endfor %}

</table>

{% endblock %}
