{% extends "base.html" %}

{% block content %}

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;">👥 Customers</h2>

    <a href="/customers/add/">
        <button style="background:#2ecc71;">+ Add Customer</button>
    </a>
</div>

<!-- SEARCH BAR -->
<form method="GET" style="margin-bottom:20px; display:flex; gap:10px;">
    <input type="text" name="search" placeholder="Search customer..."
           style="padding:10px; width:250px; border-radius:6px; border:1px solid #ccc;">
    <button type="submit">Search</button>
</form>

<!-- CUSTOMER TABLE -->
<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Actions</th>
</tr>

{% for customer in customers %}

<tr>
    <td>{{ customer.id }}</td>
    <td>{{ customer.name }}</td>
    <td>{{ customer.phone }}</td>
    <td>{{ customer.email }}</td>

    <td>
        <a href="/customers/edit/{{customer.id}}">
            <button style="background:#3498db;">Edit</button>
        </a>

        <a href="/customers/delete/{{customer.id}}" 
           onclick="return confirm('Are you sure you want to delete this customer?')">
            <button style="background:#e74c3c;">Delete</button>
        </a>
    </td>
</tr>

{% empty %}

<tr>
    <td colspan="5" style="text-align:center; padding:20px; color:gray;">
        No customers found
    </td>
</tr>

{% endfor %}

</table>

{% endblock %}
