{% extends "base.html" %}

{% block content %}

<h2>Orders</h2>

<table border="1">

<tr>
<th>Customer</th>
<th>Product</th>
<th>Quantity</th>
<th>Total Price</th>
<th>Action</th>
</tr>

{% for order in orders %}

<tr>
<td>{{ order.customer }}</td>
<td>{{ order.product }}</td>
<td>{{ order.quantity }}</td>
<td>{{ order.total_price }}</td>

<td>
<a href="/orders/delete/{{ order.id }}/">Delete</a>
</td>

</tr>

{% endfor %}

</table>

{% endblock %}
