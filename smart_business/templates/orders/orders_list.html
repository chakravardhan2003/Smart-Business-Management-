{% extends "base.html" %}

{% block content %}

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;">🧾 Orders</h2>

    <a href="/orders/add/">
        <button style="background:#2ecc71;">+ Add Order</button>
    </a>
</div>

<!-- SEARCH / FILTER -->
<form method="GET" style="margin-bottom:20px; display:flex; gap:10px;">
    <input type="text" name="search" placeholder="Search by customer or product..."
           style="padding:10px; width:300px; border-radius:6px; border:1px solid #ccc;">
    <button type="submit">Search</button>
</form>

<!-- ORDERS TABLE -->
<table>

<tr>
    <th>Customer</th>
    <th>Product</th>
    <th>Quantity</th>
    <th>Total Price</th>
    <th>Actions</th>
</tr>

{% for order in orders %}

<tr>
    <td>{{ order.customer.name }}</td>
    <td>{{ order.product.name }}</td>
    <td>{{ order.quantity }}</td>
    <td>₹ {{ order.total_price }}</td>

    <td>
        <a href="/orders/edit/{{ order.id }}/">
            <button style="background:#3498db;">Edit</button>
        </a>

        <a href="/orders/delete/{{ order.id }}/"
           onclick="return confirm('Are you sure you want to delete this order?')">
            <button style="background:#e74c3c;">Delete</button>
        </a>
    </td>


    <td>
        <a href="/orders/invoice/{{ order.id }}/">
            <button>Invoice</button>
        </a>
    </td>
</tr>

{% empty %}

<tr>
    <td colspan="5" style="text-align:center; padding:20px; color:gray;">
        No orders found
    </td>
</tr>

{% endfor %}

</table>

{% endblock %}
