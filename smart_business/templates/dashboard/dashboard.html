{% extends "base.html" %}

{% block content %}

<style>

.dashboard-container{
display:flex;
gap:30px;
margin-top:20px;
}

.card{
background:#f4f6f9;
padding:30px;
border-radius:10px;
box-shadow:0px 2px 5px rgba(0,0,0,0.1);
width:200px;
text-align:center;
}

.card h3{
margin-bottom:10px;
color:#333;
}

.card h1{
color:#007bff;
}

</style>

<h2>Dashboard</h2>

<div class="dashboard-container">

<div class="card">
<h3>Total Products</h3>
<h1>{{ product_count }}</h1>
</div>

<div class="card">
<h3>Total Customers</h3>
<h1>{{ customer_count }}</h1>
</div>

</div>

{% endblock %}
