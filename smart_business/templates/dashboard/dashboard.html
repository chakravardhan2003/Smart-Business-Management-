{% extends "base.html" %}

{% block content %}

<h2>Dashboard</h2>

<div class="card-container">

<div class="card">
<h3>Total Products</h3>
<h1>{{ product_count }}</h1>
</div>

<div class="card">
<h3>Total Customers</h3>
<h1>{{ customer_count }}</h1>
</div>

<div class="card">
<h3>Total Orders</h3>
<h1>{{ order_count }}</h1>
</div>

<div class="card">
<h3>Total Sales</h3>
<h1>₹ {{ total_sales }}</h1>
</div>

</div>

{% endblock %}
